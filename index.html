<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accent Guessr - Daily Accent Game</title>
<meta name="description" content="Five real voices a day. Listen, then guess which accent each speaker has.">
<style>
:root {
  --ag-acc: #c2410c;
  --ag-acc-soft: rgba(194, 65, 12, 0.08);
  --ag-good: #15803d;
  --ds-page: #faf8f5;
  --ds-ink: #1c1a17;
  --ds-ink-2: #6f6a63;
  --ds-hairline: #e6e1da;
  --ag-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--ds-page); color: var(--ds-ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#app { max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; }

.ag-header { margin-bottom: 28px; }
.ag-title { font-family: var(--ag-serif); font-weight: 500; font-size: 34px; margin: 0 0 6px; }
.ag-date { margin: 0 0 14px; font-size: 13px; color: var(--ds-ink-2); }
.ag-intro { margin: 0; font-size: 16px; }

.ag-home { display: flex; flex-direction: column; gap: 14px; }
.ag-btn {
  appearance: none; border: 0; cursor: pointer; border-radius: 999px;
  font: inherit; font-weight: 560; letter-spacing: 0.01em;
  padding: 14px 26px; min-height: 48px; transition: transform 0.12s ease;
}
.ag-btn:active { transform: scale(0.97); }
.ag-btn.is-primary { background: var(--ds-ink); color: var(--ds-page); }
.ag-btn.is-ghost { background: transparent; color: var(--ds-ink); box-shadow: inset 0 0 0 1.5px var(--ds-hairline); }
.ag-btn.is-big { font-size: 17px; padding: 16px 30px; width: 100%; }
.ag-linklike { background: none; border: 0; font: inherit; font-size: 14px; color: var(--ds-ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px; align-self: center; }
.ag-home-sub { margin: 14px 0 -6px; font-size: 13px; font-weight: 620; color: var(--ds-ink-2); text-align: center; }
.ag-foot { margin-top: 28px; display: flex; justify-content: center; }
.ag-auth-prompt { margin-top: 18px; padding: 16px; border-radius: 14px; background: var(--ag-acc-soft); text-align: center; }
.ag-auth-prompt p { margin: 0 0 10px; font-size: 14px; }
.ag-auth-gate { position: fixed; inset: 0; background: rgba(28, 26, 23, 0.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 20px; }
.ag-auth-gate-card { background: var(--ds-page); border-radius: 16px; padding: 22px; max-width: 340px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.ag-btn.is-locked { opacity: 0.75; }
.ag-round, .ag-home, .ag-results { animation: ag-enter 0.28s ease-out both; }
@keyframes ag-enter { from { opacity: 0; transform: translateY(8px); } }
.ag-mode-row { display: flex; gap: 10px; }
.ag-mode-row .ag-btn { flex: 1; padding: 14px 10px; }
.ag-pick-wrap { display: flex; flex-direction: column; gap: 8px; }
.ag-pick { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left; padding: 12px 16px; background: #fff; border: 1.5px solid var(--ds-hairline); border-radius: 14px; font: inherit; font-size: 16px; color: inherit; cursor: pointer; }
.ag-pick:active { background: var(--ag-acc-soft); }
.ag-pick:disabled { opacity: 0.45; cursor: default; }
.ag-pick.is-taken { text-decoration: line-through; }

.ag-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.ag-stats > div { flex: 1 1 28%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 6px; border-radius: 14px; background: var(--ag-acc-soft); }
.ag-stat-num { font-size: 22px; font-weight: 640; color: var(--ag-acc); }
.ag-stat-label { font-size: 12px; color: var(--ds-ink-2); }

.ag-round { display: flex; flex-direction: column; gap: 16px; }
.ag-progress { display: flex; align-items: center; gap: 6px; }
.ag-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ds-hairline); }
.ag-dot.is-now { background: var(--ag-acc); transform: scale(1.25); }
.ag-dot.is-done { background: var(--ds-ink); }
.ag-round-no { margin-left: auto; font-size: 13px; color: var(--ds-ink-2); }

.ag-player2 { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; padding: 8px 0 2px; }
.ag-player-row { display: flex; align-items: center; justify-content: center; gap: 22px; }
.ag-playbtn { appearance: none; background: none; border: 0; cursor: pointer; font: inherit; color: inherit; padding: 0; }
.ag-icon-btn { appearance: none; background: none; border: 0; cursor: pointer; color: var(--ds-ink-2); padding: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.ag-icon-btn:active { color: var(--ds-ink); }
.ag-player-ring { display: block; padding: 5px; border-radius: 50%; background: var(--ds-hairline); }
.ag-player-core {
  display: flex; align-items: center; justify-content: center;
  width: 96px; height: 96px; border-radius: 50%;
  background: var(--ds-ink); color: var(--ds-page);
  transition: transform 0.15s ease;
}
.ag-playbtn:active .ag-player-core { transform: scale(0.95); }
.ag-time { min-width: 78px; text-align: left; font-size: 14px; color: var(--ds-ink-2); font-variant-numeric: tabular-nums; }
.ag-track { position: relative; width: min(320px, 86%); height: 28px; cursor: pointer; touch-action: none; user-select: none; display: flex; align-items: center; }
.ag-rail { width: 100%; height: 4px; border-radius: 999px; background: var(--ds-hairline); overflow: hidden; }
.ag-track-fill { height: 100%; width: 0%; background: var(--ag-acc); border-radius: 999px; }
.ag-thumb { position: absolute; top: 50%; left: 0%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--ag-acc); box-shadow: 0 0 0 3px var(--ds-page); transition: transform .1s; }
.ag-track.is-drag .ag-thumb { transform: scale(1.25); }
.ag-track:focus-visible { outline: 2px solid var(--ag-acc); outline-offset: 2px; border-radius: 8px; }
.ag-player-hint { font-size: 12px; color: var(--ds-ink-2); }

.ag-question { margin: 0; font-size: 18px; font-weight: 620; text-align: center; }
.ag-tries { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--ds-ink-2); }
.ag-try { width: 9px; height: 9px; border-radius: 50%; background: var(--ds-hairline); }
.ag-try.is-left { background: var(--ag-acc); }

.ag-guess { position: relative; }
.ag-input {
  width: 100%; font: inherit; font-size: 16px;
  padding: 14px 18px; border-radius: 14px; border: 1.5px solid var(--ds-hairline);
  background: #fff; color: inherit; outline: none;
}
.ag-input:focus { border-color: var(--ds-ink); }
.ag-input:disabled { opacity: 0.5; background: var(--ds-page); }
.ag-options {
  position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; right: 0;
  max-height: 264px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: #fff; border: 1px solid var(--ds-hairline);
  border-radius: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
}
.ag-option {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 12px 16px; min-height: 46px; background: none; border: 0; font: inherit; font-size: 16px;
  color: inherit; cursor: pointer;
}
.ag-option:active { background: var(--ag-acc-soft); }
.ag-option.is-taken { opacity: 0.35; text-decoration: line-through; }
.ag-option-empty { padding: 14px 16px; color: var(--ds-ink-2); font-size: 14px; }
.ag-flag { font-size: 18px; }

.ag-wrong { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.ag-chip { padding: 5px 12px; border-radius: 999px; font-size: 13px; background: var(--ds-hairline); color: var(--ds-ink-2); text-decoration: line-through; }
.ag-hints { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 0; }
.ag-hint { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 550; background: var(--ag-acc-soft); color: var(--ag-acc); }

.ag-reveal { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 18px; background: var(--ag-acc-soft); }
.ag-reveal.is-right { box-shadow: inset 0 0 0 1.5px rgba(21, 128, 61, 0.35); }
.ag-reveal.is-missed { box-shadow: inset 0 0 0 1.5px var(--ds-hairline); }
.ag-reveal-head { display: flex; align-items: baseline; gap: 10px; }
.ag-reveal-flag { font-size: 26px; }
.ag-reveal-country { font-size: 22px; font-weight: 660; }
.ag-reveal-pts { margin-left: auto; font-size: 18px; font-weight: 640; color: var(--ag-acc); }
.ag-reveal.is-right .ag-reveal-pts { color: var(--ag-good); }
.ag-reveal-meta { display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: var(--ds-ink-2); }
.ag-reveal-note { margin: 0; font-size: 14px; }

.ag-results { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.ag-score { display: flex; align-items: baseline; gap: 6px; }
.ag-score-num { font-size: 52px; font-weight: 680; line-height: 1; color: var(--ag-acc); }
.ag-score-max { font-size: 20px; color: var(--ds-ink-2); }
.ag-squares { display: flex; gap: 6px; font-size: 22px; }
.ag-recap { width: 100%; display: flex; flex-direction: column; }
.ag-recap-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-top: 1px solid var(--ds-hairline); font-size: 15px; }
.ag-recap-row:first-child { border-top: 0; }
.ag-recap-flag { font-size: 18px; }
.ag-recap-pts { margin-left: auto; font-weight: 620; color: var(--ds-ink-2); }
.ag-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ag-countdown { margin: 0; font-size: 13px; color: var(--ds-ink-2); }
.ag-done { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ag-done-score { margin: 0; font-size: 17px; font-weight: 600; }

.ag-about-block { margin-top: 44px; }
.ag-about-title { font-family: var(--ag-serif); font-weight: 500; font-size: 24px; margin: 0 0 10px; }
.ag-about { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ds-ink-2); }
.ag-about a { color: var(--ag-acc); }
.ag-closing { margin: 18px 0 0; font-size: 13px; color: var(--ds-ink-2); }
.ad-slot { width: 100%; min-height: 90px; border-radius: 14px; background: var(--ds-hairline); }


.ag-tools { display: flex; align-items: center; justify-content: center; gap: 14px; }
.ag-skip { background: none; border: 0; font: inherit; font-size: 14px; color: var(--ds-ink-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px 4px; }
.ag-skip:disabled { opacity: 0.4; cursor: default; text-decoration: none; }
.ag-input-wrap { position: relative; }
.ag-input-wrap .ag-input { padding-right: 46px; }
.ag-caret { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; background: none; border: 0; padding: 10px; cursor: pointer; color: var(--ds-ink-2); }
.ag-opt-group { padding: 10px 16px 2px; font-size: 12px; font-weight: 620; letter-spacing: 0.02em; color: var(--ds-ink-2); }
.ag-option { flex-direction: column; align-items: flex-start; gap: 1px; }
.ag-opt-place { font-weight: 560; }
.ag-opt-label { font-size: 13px; color: var(--ds-ink-2); }
.ag-option.is-active { background: var(--ag-acc-soft); }
.ag-chip-in { animation: ag-chip-in 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
@keyframes ag-chip-in { from { opacity: 0; transform: translateY(8px) scale(0.92); } }
.ag-chip.is-close { background: rgba(21, 128, 61, 0.14); color: var(--ag-good); }
.ag-chip.is-mid { background: var(--ag-acc-soft); color: var(--ag-acc); }
.ag-chip-km { font-variant-numeric: tabular-nums; }
.ag-map { width: 100%; height: auto; display: block; border-radius: 12px; background: #f1ede6; }
.ag-map-c { fill: #fdfcf9; stroke: #d9d3c9; stroke-width: 0.8; }
.ag-map-c.is-wrong { fill: #cfc8bb; }
.ag-map-c.is-answer { fill: var(--ag-acc); stroke: none; }
.ag-map-region { fill: rgba(194, 65, 12, 0.3); stroke: var(--ag-acc); stroke-width: 3; }
.ag-map-region.is-wrong { fill: rgba(28, 26, 23, 0.08); stroke: var(--ds-ink-2); stroke-width: 2.5; stroke-dasharray: 6 5; }
.ag-step { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 560; background: var(--ds-hairline); color: var(--ds-ink-2); font-variant-numeric: tabular-nums; }
.ag-step.is-now { background: var(--ag-acc); color: #fff; }
.ag-step.is-done { background: var(--ds-ink); color: var(--ds-page); }
.ag-reveal-cap { margin: -4px 0 0; font-size: 12px; color: var(--ds-ink-2); }
@media (prefers-reduced-motion: reduce) {
  .ag-chip-in { animation: none; }
  .ag-round, .ag-home, .ag-results { animation: none; }
  .ag-btn { transition: none; }
}

@media (min-width: 640px) {
  .ag-player-core { width: 112px; height: 112px; }
  .ag-round { gap: 20px; }
  .ag-title { font-size: 40px; }
}
</style>
</head>
<body>
<main id="app"></main>
<script src="map-data.js?v=1"></script>
<script src="auth-config.js?v=1"></script>
<script src="auth.js?v=1"></script>
<script src="app.js?v=13"></script>
</body>
</html>
